name: Feature
description: Registrar uma funcionalidade ou melhoria
title: "[Feature] "
labels: [feature]
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que precisa ser entregue?
    validations:
      required: true
  - type: input
    id: eap
    attributes:
      label: Pacote EAP
      description: Informe o pacote correspondente no Plano de Projeto.
    validations:
      required: true
  - type: input
    id: horas
    attributes:
      label: Horas previstas
      description: Informe a estimativa acordada pela equipe.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      description: Liste condições verificáveis para concluir a Issue.
    validations:
      required: true
