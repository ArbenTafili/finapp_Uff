# Perfil dos testes automatizados: PostgreSQL real em container (Testcontainers), criado
# pelo próprio driver JDBC. Exige Docker em execução, mas não o docker compose.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///finapp?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
