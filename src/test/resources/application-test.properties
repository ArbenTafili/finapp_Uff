# Perfil dos testes automatizados: banco em memória, sem depender do ambiente de quem roda.
spring.datasource.url=jdbc:h2:mem:finapp-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
