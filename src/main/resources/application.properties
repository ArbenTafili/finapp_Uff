spring.application.name=finapp

# Perfis: h2 (padrão, sem Docker), docker (aplicação em container), dev (aplicação na
# máquina com o PostgreSQL do docker compose) e test (testes automatizados).
spring.profiles.default=h2

# O schema é criado e evoluído pelo Flyway (db/migration); o Hibernate apenas confere.
spring.jpa.hibernate.ddl-auto=validate
# Bancos criados pela Demo v1 (sem histórico do Flyway) entram como V1 e recebem as migrações seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
