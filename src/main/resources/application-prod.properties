# Perfil de produção/hospedagem (SPRING_PROFILES_ACTIVE=prod): PostgreSQL gerenciado + conta de teste.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Plataformas de hospedagem informam a porta em PORT
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

# Sem console do H2 nem logs de SQL em produção
spring.h2.console.enabled=false

# Acesso protegido por conta de teste (HTTP Basic); exige as duas variáveis abaixo
finapp.acesso-teste.habilitado=true
finapp.acesso-teste.usuario=${FINAPP_ACESSO_TESTE_USUARIO}
finapp.acesso-teste.senha=${FINAPP_ACESSO_TESTE_SENHA}

# Dados de exemplo na primeira subida (desligue com FINAPP_SEED_DEMO=false)
finapp.seed.demo=${FINAPP_SEED_DEMO:true}
