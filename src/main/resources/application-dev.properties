# Aplicação na máquina (./gradlew bootRun --args='--spring.profiles.active=dev') e PostgreSQL via "docker compose up -d db".
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:finapp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:finapp}
spring.datasource.password=${POSTGRES_PASSWORD:finapp}
