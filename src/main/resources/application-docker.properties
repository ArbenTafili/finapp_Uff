# Perfil usado quando a aplicação roda em container (docker compose up --build).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/finapp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finapp}
