# Perfil usado ao subir a API via docker-compose, com Postgres no lugar do H2 em memoria.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/finapp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finapp}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
